name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate project
        run: npm run check:offline

      - name: Build release artifacts
        run: npm run release:build
        env:
          MESTRE_ORC_RELEASE_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}

      - name: Verify installation package
        run: npm run install:verify

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mestre-orc-${{ github.ref_name }}
          path: dist/distribution/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/distribution/* --generate-notes --verify-tag
