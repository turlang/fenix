name: Apply VTT canvas feedback patch

on:
  push:
    branches: [feat/vtt-canvas-ux-2]
    paths:
      - scripts/patch-vtt-canvas-feedback.mjs
      - .github/workflows/apply-vtt-canvas-feedback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vtt-canvas-ux-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/patch-vtt-canvas-feedback.mjs
      - name: Validate focused regression
        run: node --test test/vtt-canvas-feedback-regression.test.js
      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/fenix-vtt/components/map-stage.jsx apps/fenix-vtt/components/vtt-shell.jsx apps/fenix-vtt/components/scene-settings-inspector.jsx apps/fenix-vtt/app/grid-authoring-v2.css apps/fenix-vtt/app/wall-authoring.css apps/fenix-vtt/app/scene-manager.css packages/campaign-scene-service/src/index.js test/vtt-canvas-feedback-regression.test.js
          git commit -m "fix: align grid and add editable wall selection"
          git push origin HEAD:feat/vtt-canvas-ux-2
