name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate all layers
        run: npm run check

  simulation-reports:
    name: Simulation reports
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate complete-session report
        run: npm run test:session
        env:
          SIMULATION_REPORT_FILE: reports/session-report.json

      - name: Generate load report
        run: npm run test:load
        env:
          LOAD_REPORT_FILE: reports/load-report.json
          LOAD_SESSIONS: 6
          LOAD_PLAYERS: 8
          LOAD_ROUNDS: 3

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: mestre-orc-simulation-reports
          path: reports/*.json
          if-no-files-found: error
