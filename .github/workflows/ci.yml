name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Core / Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate structure
        run: node scripts/validate.mjs

      - name: Run tests
        run: node --test

  dependency-smoke:
    name: Runtime dependency smoke / Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install runtime dependencies with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "npm ci attempt ${attempt}/2"
            if timeout 45s npm ci --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=20000; then
              exit 0
            fi
            rm -rf node_modules "$HOME/.npm/_cacache/tmp" || true
          done
          exit 1

      - name: Import Fastify runtime
        run: node -e "import('fastify').then(() => console.log('Fastify runtime OK'))"
