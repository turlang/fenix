name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Core / Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate structure
        run: node scripts/validate.mjs

      - name: Run tests
        run: node --test

  integration-build:
    name: Portable install + auth + realtime + VTT build / Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify portable lockfile
        run: node scripts/normalize-package-lock-registry.mjs --check

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Import Fastify runtimes
        run: node -e "Promise.all([import('fastify'), import('@fastify/websocket')]).then(() => console.log('Fastify realtime runtime OK'))"

      - name: Test auth and campaign HTTP
        run: npm run test:auth-integration

      - name: Test realtime WebSocket adapter
        run: npm run test:realtime-integration

      - name: Build standalone VTT
        env:
          NEXT_PUBLIC_FENIX_API_URL: http://localhost:3001
        run: npm run build:vtt
