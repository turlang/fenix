name: Fenix3D Native

on:
  workflow_dispatch:
    inputs:
      package_runtime:
        description: Package Fenix3D Win64 after native build
        required: false
        default: true
        type: boolean
      run_stream_smoke:
        description: Run first native Render Node -> Pixel Streaming session and capture evidence
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  unreal-native:
    runs-on: [self-hosted, Windows, X64, fenix3d]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: GPU and UE5.5 preflight
        shell: powershell
        env:
          FENIX_UNREAL_ENGINE_ROOT: ${{ vars.FENIX_UNREAL_ENGINE_ROOT }}
        run: npm run preflight:fenix3d-gpu

      - name: Native UE5.5 build
        shell: powershell
        env:
          FENIX_UNREAL_ENGINE_ROOT: ${{ vars.FENIX_UNREAL_ENGINE_ROOT }}
        run: npm run build:fenix3d-native

      - name: Package Win64 runtime
        if: ${{ inputs.package_runtime }}
        shell: powershell
        env:
          FENIX_UNREAL_ENGINE_ROOT: ${{ vars.FENIX_UNREAL_ENGINE_ROOT }}
          FENIX_UNREAL_ARCHIVE_DIR: ${{ vars.FENIX_UNREAL_ARCHIVE_DIR }}
          FENIX_UNREAL_PACKAGE_CONFIG: Development
        run: npm run package:fenix3d

      - name: First native GPU session smoke
        if: ${{ inputs.run_stream_smoke }}
        shell: powershell
        env:
          FENIX_RENDER_NODE_INTERNAL_URL: ${{ vars.FENIX_RENDER_NODE_INTERNAL_URL }}
          FENIX_RENDER_NODE_TOKEN: ${{ secrets.FENIX_RENDER_NODE_TOKEN }}
          FENIX_3D_SMOKE_REQUIRE_PROCESS: true
          FENIX_3D_SMOKE_REQUIRE_EVIDENCE: true
          FENIX_3D_SMOKE_REQUIRE_READINESS: true
          FENIX_3D_SMOKE_REPORT_PATH: artifacts/fenix3d-native-session.json
        run: npm run smoke:fenix3d

      - name: Upload native session evidence
        if: ${{ always() && inputs.run_stream_smoke }}
        uses: actions/upload-artifact@v4
        with:
          name: fenix3d-native-session-evidence
          path: artifacts/fenix3d-native-session.json
          if-no-files-found: error
          retention-days: 14
